<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- Beautiful premium gradient matching DSAlytics styling -->
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Premium rounded square background matching the app's brand logo -->
  <rect width="32" height="32" rx="9" fill="url(#brand-grad)" />
  <!-- Beautiful white Award/Medal ribbon SVG icon perfectly centered -->
  <g transform="translate(4, 4) scale(1)" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="12" cy="8" r="7" />
    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
  </g>
</svg>
